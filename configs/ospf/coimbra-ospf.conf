! NovaLingua School
! Configuración OSPF - Router Coimbra
!
! Reconstruida a partir de la configuración documentada
! durante el proyecto original.

router ospf
 ospf router-id 3.3.3.3

 ! Enlace Coimbra - Porto
 network 10.255.2.0/30 area 0

 ! VLAN 30 - Académico
 network 10.30.30.0/24 area 0

 ! VLAN 40 - Atención al Cliente
 network 10.30.40.0/24 area 0

 ! VLAN 60 - Invitados
 network 10.30.60.0/24 area 0

 ! VLAN 70 - Gestión
 network 10.30.70.0/24 area 0

 ! VLAN 80 - Wi-Fi Corporativo
 network 10.30.80.0/24 area 0