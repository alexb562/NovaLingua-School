! NovaLingua School
! Configuración OSPF - Router Braga
!
! Reconstruida a partir de la configuración documentada
! durante el proyecto original.

router ospf
 ospf router-id 2.2.2.2

 ! Enlace Braga - Porto
 network 10.255.1.0/30 area 0

 ! VLAN 30 - Académico
 network 10.20.30.0/24 area 0

 ! VLAN 40 - Atención al Cliente
 network 10.20.40.0/24 area 0

 ! VLAN 60 - Invitados
 network 10.20.60.0/24 area 0

 ! VLAN 70 - Gestión
 network 10.20.70.0/24 area 0

 ! VLAN 80 - Wi-Fi Corporativo
 network 10.20.80.0/24 area 0